<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  :root{
    --ink:#14342a; --paper:#faf8f3; --text:#20241f; --muted:#6b7269;
    --accent:#b5552f; --line:#e7e2d6; --tag:#eef1ea; --card:#ffffff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--paper); color:var(--text);
       font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
       font-size:15px; line-height:1.5;}
  header{position:sticky; top:0; z-index:10; background:var(--ink); color:#fff;
         padding:14px 16px 12px; box-shadow:0 1px 0 rgba(0,0,0,.06);}
  .brand{font-size:12px; letter-spacing:.18em; opacity:.7;}
  .title{font-size:18px; font-weight:700; margin-top:2px;
         display:flex; align-items:baseline; gap:8px;}
  .total{font-size:12px; font-weight:400; opacity:.75;}
  .panel{padding:12px 16px; background:#fff; border-bottom:1px solid var(--line);}
  .kw{width:100%; padding:12px 14px; font-size:16px; border:1px solid var(--line);
      border-radius:12px; background:var(--paper); outline:none;}
  .kw:focus{border-color:var(--ink);}
  .selrow{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px;}
  select{width:100%; padding:9px 8px; font-size:13px; border:1px solid var(--line);
         border-radius:10px; background:var(--paper); color:var(--text);}
  .chips{display:flex; gap:7px; overflow-x:auto; margin-top:10px; padding-bottom:2px;
         -webkit-overflow-scrolling:touch;}
  .chip{white-space:nowrap; font-size:12.5px; padding:6px 12px; border-radius:999px;
        border:1px solid var(--line); background:#fff; color:var(--muted);}
  .chip.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  .barbtn{display:flex; gap:8px; margin-top:10px;}
  .go{flex:1; padding:12px; border:none; border-radius:12px; background:var(--accent);
      color:#fff; font-size:15px; font-weight:700;}
  .clear{padding:12px 14px; border:1px solid var(--line); border-radius:12px;
         background:#fff; color:var(--muted); font-size:13px;}
  .meta{padding:10px 16px 2px; font-size:12px; color:var(--muted);}
  .list{padding:6px 12px 90px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px;
        padding:13px 14px; margin:8px 4px; box-shadow:0 1px 2px rgba(20,52,42,.04);}
  .name{font-size:16px; font-weight:700;}
  .co{font-size:13px; color:var(--text); margin-top:1px;}
  .sub{font-size:12px; color:var(--muted); margin-top:1px;}
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .t{font-size:11px; padding:3px 9px; border-radius:999px; background:var(--tag);
     color:var(--ink);}
  .t.role{background:#f3e9e2; color:var(--accent);}
  .acts{display:flex; gap:8px; margin-top:11px;}
  .act{flex:1; text-align:center; text-decoration:none; font-size:12.5px;
       padding:9px 4px; border-radius:10px; border:1px solid var(--line);
       color:var(--ink); background:#fff;}
  .act.dim{color:#c2c2bb; border-color:#eee; pointer-events:none;}
  .empty{padding:48px 24px; text-align:center; color:var(--muted);}
  .empty b{display:block; color:var(--text); font-size:15px; margin-bottom:6px;}
  .spin{padding:40px; text-align:center; color:var(--muted); font-size:13px;}
</style>
</head>
<body>
  <header>
    <div class="brand">GINZA TOKYO FLOWER</div>
    <div class="title">名刺検索 <span class="total" id="total">読み込み中…</span></div>
  </header>

  <div class="panel">
    <input id="kw" class="kw" type="search" placeholder="会社名・氏名・住所で検索"
           enterkeyhint="search">
    <div class="selrow">
      <select id="pref"><option value="">都道府県</option></select>
      <select id="ind"><option value="">業種</option></select>
      <select id="role"><option value="">役職</option></select>
    </div>
    <div class="chips" id="chips"></div>
    <div class="barbtn">
      <button class="go" id="go">検索</button>
      <button class="clear" id="clear">クリア</button>
    </div>
  </div>

  <div class="meta" id="meta"></div>
  <div class="list" id="list">
    <div class="empty"><b>条件を選んで検索</b>会社名・氏名・住所のほか、業種や役職でも絞り込めます。</div>
  </div>

<script>
  var EL = function(id){ return document.getElementById(id); };
  var state = { pref:'', ind:'', role:'' };

  // クイックチップ(3軸＋よく使う条件)
  var QUICK = [
    {label:'経営者', role:'経営者'},
    {label:'🌸 花卉・園芸', ind:'花卉・園芸'},
    {label:'🛒 EC・通販', ind:'EC・通販'},
    {label:'🍷 ギフト向け(士業)', ind:'士業'},
    {label:'東京都', pref:'東京都'}
  ];

  // 初期化
  google.script.run.withSuccessHandler(initFilters).withFailureHandler(showErr).getFilters();

  function initFilters(f){
    EL('total').textContent = '登録 ' + f.total.toLocaleString() + ' 件';
    fill(EL('pref'), f.prefs, '都道府県');
    fill(EL('ind'),  f.industries, '業種');
    fill(EL('role'), f.roles, '役職');
    renderChips();
  }
  function fill(sel, arr, label){
    sel.innerHTML = '<option value="">'+label+'</option>';
    arr.forEach(function(o){
      var op=document.createElement('option');
      op.value=o.name; op.textContent=o.name+' ('+o.count+')';
      sel.appendChild(op);
    });
  }
  function renderChips(){
    var box=EL('chips'); box.innerHTML='';
    QUICK.forEach(function(q,i){
      var c=document.createElement('div'); c.className='chip'; c.textContent=q.label;
      var active=(q.role&&state.role===q.role)||(q.ind&&state.ind===q.ind)||(q.pref&&state.pref===q.pref);
      if(active) c.className+=' on';
      c.onclick=function(){
        if(q.role) state.role = state.role===q.role?'':q.role;
        if(q.ind)  state.ind  = state.ind===q.ind?'':q.ind;
        if(q.pref) state.pref = state.pref===q.pref?'':q.pref;
        syncSelects(); renderChips(); search();
      };
      box.appendChild(c);
    });
  }
  function syncSelects(){ EL('pref').value=state.pref; EL('ind').value=state.ind; EL('role').value=state.role; }

  ['pref','ind','role'].forEach(function(k){
    EL(k).onchange=function(){ state[k]=this.value; renderChips(); search(); };
  });
  EL('go').onclick=search;
  EL('kw').addEventListener('keyup', function(e){ if(e.key==='Enter') search(); });
  EL('clear').onclick=function(){
    EL('kw').value=''; state={pref:'',ind:'',role:''}; syncSelects(); renderChips();
    EL('meta').textContent='';
    EL('list').innerHTML='<div class="empty"><b>条件を選んで検索</b>会社名・氏名・住所のほか、業種や役職でも絞り込めます。</div>';
  };

  function search(){
    var q={ keyword:EL('kw').value, pref:state.pref, industry:state.ind, roleLevel:state.role };
    if(!q.keyword && !q.pref && !q.industry && !q.roleLevel){
      EL('meta').textContent=''; return;
    }
    EL('list').innerHTML='<div class="spin">検索中…</div>';
    google.script.run.withSuccessHandler(render).withFailureHandler(showErr).searchCards(q);
  }

  function render(res){
    EL('meta').textContent = res.count + ' 件' + (res.limited ? '（上位のみ表示。条件を絞ってください）':'');
    if(!res.count){
      EL('list').innerHTML='<div class="empty"><b>該当なし</b>キーワードを短くするか、絞り込みを外してみてください。</div>';
      return;
    }
    var html = res.items.map(card).join('');
    EL('list').innerHTML = html;
  }

  function esc(s){ return String(s||'').replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }

  function card(p){
    var tel = p.telCompany || p.mobile;
    var telAct = tel
      ? '<a class="act" href="tel:'+esc(tel.replace(/[^0-9+]/g,''))+'">📞 電話</a>'
      : '<span class="act dim">📞 電話</span>';
    var mailAct = p.email
      ? '<a class="act" href="mailto:'+esc(p.email)+'">✉️ メール</a>'
      : '<span class="act dim">✉️ メール</span>';
    var mapAct = p.address
      ? '<a class="act" target="_blank" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.address)+'">🗺️ 地図</a>'
      : '<span class="act dim">🗺️ 地図</span>';
    var siteAct = p.url
      ? '<a class="act" target="_blank" href="'+esc(p.url)+'">🌐 サイト</a>'
      : '<span class="act dim">🌐 サイト</span>';

    var line2 = [p.company, p.dept].filter(Boolean).join(' / ');
    var line3 = [p.title, p.address].filter(Boolean).join('　');
    var tags = '';
    if(p.industry) tags += '<span class="t">'+esc(p.industry)+'</span>';
    if(p.roleLevel && p.roleLevel!=='不明') tags += '<span class="t role">'+esc(p.roleLevel)+'</span>';
    if(p.exchanged) tags += '<span class="t">交換 '+esc(p.exchanged)+'</span>';

    return '<div class="card">'+
      '<div class="name">'+esc(p.name||'(氏名不明)')+'</div>'+
      (line2?'<div class="co">'+esc(line2)+'</div>':'')+
      (line3?'<div class="sub">'+esc(line3)+'</div>':'')+
      '<div class="tags">'+tags+'</div>'+
      '<div class="acts">'+telAct+mailAct+mapAct+siteAct+'</div>'+
    '</div>';
  }

  function showErr(e){
    EL('list').innerHTML='<div class="empty"><b>エラー</b>'+esc(e && e.message || e)+'</div>';
  }
</script>
</body>
</html>
